name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.assets.outputs.version }}
      tag: ${{ steps.assets.outputs.tag }}
      changed: ${{ steps.assets.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Check sources and generated files
        run: python3 scripts/check.py
      - name: Prepare release assets
        id: assets
        env:
          # Pull requests compare with their base. The previous head can vanish after a force-push.
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--output "$RUNNER_TEMP/release-assets")
          if [[ -n "$BEFORE" ]]; then
            previous_version=$(git show "$BEFORE:VERSION")
            args+=(--previous-version "$previous_version")
          fi
          python3 scripts/release.py "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Store checked assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.check.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download checked assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
      - name: Publish release
        working-directory: ${{ runner.temp }}/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases")
          existing=$(jq -c '[.[][] | select(.tag_name == env.TAG)][0] // empty' <<< "$releases")
          if [[ -n "$existing" ]] && [[ $(jq -r '.draft' <<< "$existing") == false ]]; then
            echo "$TAG is already published; leaving it unchanged."
            exit 0
          fi

          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG")
          tag_ref=$(jq -r '.[] | select(.ref == ("refs/tags/" + env.TAG)) | .ref' <<< "$refs")
          if [[ -n "$tag_ref" ]]; then
            target=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already points to a different commit."
              exit 1
            fi
          fi

          if [[ -n "$existing" ]]; then
            if [[ $(jq -r '.target_commitish' <<< "$existing") != "$GITHUB_SHA" ]]; then
              echo "::error::The existing draft targets a different commit."
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* \
              --draft --target "$GITHUB_SHA" --title "Lucretia $VERSION" \
              --generate-notes \
              --notes "[Installation instructions](https://github.com/$GH_REPO/blob/$TAG/README.md). The Obsidian ZIP contains the Lucretia theme folder and the optional Minimal snippet."
          fi
          gh release edit "$TAG" --draft=false
